<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 -130 1000 690" width="1000" height="690" role="img">
<title>Schaltplan Messpfad: Der NodeMCU versorgt den ADS1115 mit 3,3 Volt und spricht ihn über SDA an D2 und SCL an D1 an. ADDR liegt auf GND, Adresse 0x48. Ein MT3608-Step-up hängt mit seinem Eingang an VBAT von Blatt 1 und liefert 5 Volt an VCC des kapazitiven Sensors. Der Analogausgang des Sensors geht an Eingang A0 des ADS1115. Die Masse von Step-up und Sensor wird gemeinsam über einen N-Kanal-MOSFET geschaltet, den D5 ansteuert; ein 10-Kilo-Ohm-Widerstand hält das Gate im Deep Sleep auf GND.</title>
<style>
  svg { color: #15212b; }
  text { font-family: "IBM Plex Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #15212b; }
  .t12 { font-size: 12px; } .t10 { font-size: 10px; } .b { font-weight: 600; }
  .m { fill: #5d6c78; }
  .w { fill: none; stroke: #15212b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .acc { stroke: #c0451c; } .accf { fill: #c0451c; } .acct { fill: #c0451c; font-weight: 600; }
  .box, .part { fill: #f6f8f7; stroke: #15212b; stroke-width: 1.5; }
  .dot { fill: #15212b; }
  .nc { stroke: #5d6c78; stroke-width: 1.3; fill: none; }
</style>
<rect x="0" y="-130" width="1000" height="690" fill="#f6f8f7"/>

        <defs>
          <g id="gnd">
            <line class="w" x1="-10" y1="0" x2="10" y2="0"/>
            <line class="w" x1="-6" y1="4" x2="6" y2="4"/>
            <line class="w" x1="-2" y1="8" x2="2" y2="8"/>
          </g>
          <g id="nc">
            <line class="nc" x1="-4" y1="-4" x2="4" y2="4"/>
            <line class="nc" x1="-4" y1="4" x2="4" y2="-4"/>
          </g>
        </defs>
        <!-- NodeMCU -->
        <rect class="box" x="60" y="80" width="200" height="340"/>
        <text class="t12 b" x="160" y="342" text-anchor="middle">NodeMCU</text>
        <text class="m" x="160" y="360" text-anchor="middle">3V3 und GND von Blatt 1</text>
        <g class="t10">
          <text x="252" y="124" text-anchor="end">3V3</text>
          <text x="252" y="164" text-anchor="end">GND</text>
          <text x="252" y="204" text-anchor="end">D1 · GPIO5 · SCL</text>
          <text x="252" y="244" text-anchor="end">D2 · GPIO4 · SDA</text>
          <text class="m" x="252" y="284" text-anchor="end">A0 (frei)</text>
          <text x="252" y="404" text-anchor="end">D5 · GPIO14</text>
        </g>
        <g class="w">
          <line x1="260" y1="120" x2="290" y2="120"/>
          <line x1="260" y1="160" x2="290" y2="160"/>
          <line x1="260" y1="200" x2="290" y2="200"/>
          <line x1="260" y1="240" x2="290" y2="240"/>
          <line x1="260" y1="280" x2="290" y2="280"/>
          <line x1="260" y1="400" x2="290" y2="400"/>
        </g>
        <use xlink:href="#nc" x="290" y="280"/>

        <!-- U4 ADS1115 -->
        <rect class="box" x="440" y="80" width="200" height="270"/>
        <text class="t12 b" x="548" y="292" text-anchor="middle">U4  ADS1115</text>
        <text class="m" x="548" y="310" text-anchor="middle">16 Bit · I2C · 0x48</text>
        <text class="m" x="548" y="326" text-anchor="middle">GAIN 1 · ±4,096 V</text>
        <g class="t10">
          <text x="448" y="124">VDD</text>
          <text x="448" y="164">GND</text>
          <text x="448" y="204">SCL</text>
          <text x="448" y="244">SDA</text>
          <text x="448" y="284">ADDR</text>
          <text x="448" y="324">ALRT</text>
          <text x="632" y="124" text-anchor="end">A0</text>
          <text x="632" y="164" text-anchor="end">A1</text>
          <text x="632" y="204" text-anchor="end">A2</text>
          <text x="632" y="244" text-anchor="end">A3</text>
        </g>
        <g class="w">
          <line x1="410" y1="120" x2="440" y2="120"/>
          <line x1="410" y1="160" x2="440" y2="160"/>
          <line x1="410" y1="200" x2="440" y2="200"/>
          <line x1="410" y1="240" x2="440" y2="240"/>
          <line x1="410" y1="280" x2="440" y2="280"/>
          <line x1="410" y1="320" x2="440" y2="320"/>
          <line x1="640" y1="120" x2="670" y2="120"/>
          <line x1="640" y1="160" x2="670" y2="160"/>
          <line x1="640" y1="200" x2="670" y2="200"/>
          <line x1="640" y1="240" x2="670" y2="240"/>
        </g>
        <use xlink:href="#nc" x="410" y="320"/>
        <use xlink:href="#nc" x="670" y="160"/>
        <use xlink:href="#nc" x="670" y="200"/>
        <use xlink:href="#nc" x="670" y="240"/>

        <!-- J1 Sensor -->
        <rect class="box" x="800" y="60" width="160" height="180"/>
        <text class="t12 b" x="890" y="96" text-anchor="middle">J1  Sensor</text>
        <text x="890" y="130" text-anchor="middle">kapazitiv v1.2</text>
        <text class="m" x="890" y="192" text-anchor="middle">VCC 5 V von U5</text>
        <text class="m" x="890" y="208" text-anchor="middle">AOUT 1,2–3 V</text>
        <g class="t10">
          <text x="808" y="104">VCC</text>
          <text x="808" y="164">AOUT</text>
          <text x="808" y="224">GND</text>
        </g>
        <g class="w">
          <line x1="770" y1="100" x2="800" y2="100"/>
          <line x1="770" y1="160" x2="800" y2="160"/>
          <line x1="770" y1="220" x2="800" y2="220"/>
        </g>

        <!-- Netze -->
        <line class="w" x1="290" y1="120" x2="410" y2="120"/>
        <text class="t10 m" x="350" y="114" text-anchor="middle">3V3</text>

        <!-- U5 MT3608 Step-up, nur fuer den Sensor -->
        <rect class="box" x="800" y="-110" width="160" height="130"/>
        <text class="t12 b" x="890" y="-84" text-anchor="middle">U5  MT3608</text>
        <text x="890" y="-52" text-anchor="middle">Step-up</text>
        <text class="t10 m" x="890" y="-36" text-anchor="middle">auf 5,0 V</text>
        <text class="t10 m" x="890" y="-22" text-anchor="middle">einstellen</text>
        <g class="t10">
          <text x="808" y="-66">IN+</text>
          <text x="808" y="-6">OUT+</text>
          <text x="952" y="-6" text-anchor="end">IN−/OUT−</text>
        </g>
        <!-- VBAT von Blatt 1 -->
        <path class="part" d="M312,-70 L300,-76 L300,-64 Z"/>
        <line class="w" x1="312" y1="-70" x2="800" y2="-70"/>
        <text class="t10" x="300" y="-84">VBAT · von Blatt 1</text>
        <text class="t10 m" x="300" y="-50">3,0–4,2 V, nicht über den HT7333</text>
        <!-- 5 V zum Sensor -->
        <polyline class="w" points="800,-10 750,-10 750,100 770,100"/>
        <text class="t10 m" x="744" y="50" text-anchor="end">5 V</text>
        <!-- Masse U5 geschaltet ueber Q1 -->
        <polyline class="w acc" points="960,-10 982,-10 982,270 740,270"/>
        <circle class="accf" cx="740" cy="270" r="3.5"/>
        <text class="t10 acct" x="974" y="288" text-anchor="end">Masse U5 + Sensor, geschaltet</text>
        <circle class="dot" cx="390" cy="120" r="3.5"/>
        <line class="w" x1="390" y1="120" x2="390" y2="136"/>
        <line class="w" x1="380" y1="136" x2="400" y2="136"/>
        <line class="w" x1="380" y1="144" x2="400" y2="144"/>
        <line class="w" x1="390" y1="144" x2="390" y2="160"/>
        <circle class="dot" cx="390" cy="160" r="3.5"/>
        <text class="t10" x="396" y="153">C1 100n</text>
        <line class="w" x1="290" y1="160" x2="410" y2="160"/>
        <circle class="dot" cx="330" cy="160" r="3.5"/>
        <polyline class="w" points="330,160 330,480 740,480"/>
        <use xlink:href="#gnd" x="330" y="480"/>
        <line class="w" x1="290" y1="200" x2="410" y2="200"/>
        <line class="w" x1="290" y1="240" x2="410" y2="240"/>
        <text class="t10 m" x="350" y="194" text-anchor="middle">SCL</text>
        <text class="t10 m" x="350" y="234" text-anchor="middle">SDA</text>
        <polyline class="w" points="410,280 390,280 390,480"/>
        <circle class="dot" cx="390" cy="480" r="3.5"/>
        <text class="t10 m" x="398" y="366">ADDR an GND</text>
        <text class="t10 m" x="398" y="379">= Adresse 0x48</text>
        <polyline class="w" points="670,120 700,120 700,160 770,160"/>
        <text class="t10 m" x="735" y="154" text-anchor="middle">AOUT</text>

        <!-- Sensor GND ueber Q1 -->
        <g class="w acc">
          <polyline points="770,220 740,220 740,360"/>
          <line x1="740" y1="360" x2="740" y2="388"/>
          <line x1="740" y1="388" x2="736" y2="388"/>
          <line x1="736" y1="386" x2="736" y2="414"/>
          <line x1="736" y1="412" x2="740" y2="412"/>
          <line x1="740" y1="412" x2="740" y2="480"/>
          <line x1="728" y1="386" x2="728" y2="414"/>
          <line x1="722" y1="400" x2="728" y2="400"/>
        </g>
        <text class="t10 acct" x="752" y="396">Q1</text>
        <text class="t10" x="752" y="409">N-MOSFET, Logic Level</text>
        <text class="t10 m" x="752" y="422">z. B. 2N7000, IRLML2502</text>
        <text class="t10 m" x="752" y="376">D</text>
        <text class="t10 m" x="752" y="440">S</text>
        <g class="w acc">
          <line x1="290" y1="400" x2="722" y2="400"/>
        </g>
        <circle class="accf" cx="690" cy="400" r="3.5"/>
        <text class="t10 acct" x="520" y="392">Sensor ein: HIGH</text>
        <line class="w" x1="690" y1="400" x2="690" y2="420"/>
        <rect class="part" x="682" y="420" width="16" height="40"/>
        <line class="w" x1="690" y1="460" x2="690" y2="480"/>
        <circle class="dot" cx="690" cy="480" r="3.5"/>
        <text class="t10" x="676" y="444" text-anchor="end">R1 10k</text>

        <g class="t10 m">
          <circle class="dot" cx="66" cy="522" r="3.5"/>
          <text x="78" y="526">Verbindung</text>
          <use xlink:href="#nc" x="66" y="542"/>
          <text x="78" y="546">Pin nicht belegt</text>
          <line class="w acc" x1="180" y1="522" x2="192" y2="522"/>
          <text x="200" y="526">Sensor und U5 schaltbar, Firmware steuert D5</text>
        </g>
        <g class="t10 m">
          <text x="960" y="526" text-anchor="end">SoilMoistureSens · Messpfad · Rev D</text>
          <text x="960" y="542" text-anchor="end">2026-09-18 · Firmware feature/config-ui-sleep-mode</text>
        </g>
      </svg>
